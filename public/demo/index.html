<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Levity static editor</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#182226;background:#f6f8f7}*{box-sizing:border-box}body{margin:0}.top{height:58px;border-bottom:1px solid #dfe6e2;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.brand{font-weight:800;letter-spacing:-.03em}.brand span{color:#2b8a68}.endpoint{font:12px ui-monospace;color:#71807a}.layout{display:grid;grid-template-columns:220px minmax(0,1fr) 360px;height:calc(100vh - 58px)}aside,.workspace{min-width:0}.files{border-right:1px solid #dfe6e2;background:#fbfcfb;padding:18px 12px}.label{display:flex;justify-content:space-between;color:#74817c;font-size:11px;font-weight:800;letter-spacing:.12em;margin:0 8px 14px}.files button,.toolbar button,.image button{border:0;background:transparent;color:#52615b;cursor:pointer}.project{font-weight:700;font-size:13px;padding:10px}.file{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:6px;color:#52615b;cursor:pointer}.file.active{background:#e6f3ed;color:#18724f;font-weight:700}.hint{font-size:11px;color:#8a9691;line-height:1.5;margin:18px 8px}.workspace{display:flex;flex-direction:column;background:#fff}.toolbar{height:52px;border-bottom:1px solid #e5ebe8;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.toolbar button{border:1px solid #d8e2dd;border-radius:6px;padding:7px 11px}.code{display:grid;grid-template-columns:42px 1fr;flex:1;min-height:0;background:#fbfcfb}.numbers{padding:18px 10px;text-align:right;color:#9aa7a1;font:13px/1.65 ui-monospace}.code textarea{resize:none;border:0;outline:0;background:transparent;padding:18px 12px;color:#26332e;font:13px/1.65 ui-monospace;white-space:pre;overflow:auto}.composer{border-top:1px solid #e5ebe8;padding:12px;display:flex;gap:8px}.composer input,.system textarea,.image input{border:1px solid #d8e2dd;border-radius:6px;padding:10px;outline:0}.composer input{flex:1}.composer button{background:#1f805d;color:white;border:0;border-radius:6px;padding:0 15px}.ai{border-left:1px solid #dfe6e2;background:#fbfcfb;display:flex;flex-direction:column;min-height:0}.aihead{padding:18px;border-bottom:1px solid #e5ebe8}.status{font-size:12px;color:#18724f;margin-top:8px}.model{font-size:11px;color:#7d8984;margin-top:5px}.chat{padding:14px;overflow:auto;flex:1}.msg{margin:0 0 14px;line-height:1.5;font-size:13px}.msg b{font-size:11px;color:#7d8984;display:block;margin-bottom:4px}.msg.user{color:#34433d}.activity{border:1px solid #dce8e2;border-radius:7px;background:white;margin-top:8px}.activity summary{cursor:pointer;padding:9px;font-size:12px;color:#396b55}.events{padding:0 10px 9px;font-size:11px;color:#6f7c76}.event{padding:4px 0}.system,.image{padding:12px;border-top:1px solid #e5ebe8;display:grid;gap:7px}.system textarea{height:62px;font:12px system-ui;resize:vertical}.system label,.image label{font-size:11px;color:#71807a}.image input{width:100%;font-size:12px}.image button{text-align:left;font-size:11px}.preview{flex:1;padding:30px;overflow:auto}@media(max-width:900px){.layout{grid-template-columns:170px minmax(0,1fr)}.ai{grid-column:1/-1;height:420px;border-left:0;border-top:1px solid #dfe6e2}.layout{height:auto;min-height:calc(100vh - 58px)}.workspace{min-height:520px}.endpoint{display:none}}@media(max-width:560px){.layout{display:block}.files{border-right:0;border-bottom:1px solid #dfe6e2}.file{display:inline-block;width:auto}.top{padding:0 12px}.workspace{min-height:500px}}
</style></head>
<body><header class="top"><div class="brand">Levity <span>/ static editor</span></div><div class="endpoint">https://levityai-three.vercel.app</div></header><main class="layout"><aside class="files"><div class="label">FILES <button id="newFile">+</button></div><div class="project">demo-project</div><div id="fileList"></div><div class="hint">Every AI write action is applied automatically: edit, create, clear, delete, move, duplicate, and folders.</div></aside><section class="workspace"><div class="toolbar"><strong id="activeName">index.html</strong><button id="previewBtn">Preview</button></div><div id="editor" class="code"><div id="numbers" class="numbers"></div><textarea id="content" spellcheck="false"></textarea></div><div id="preview" class="preview" hidden></div><div class="composer"><input id="prompt" placeholder="Ask AI to edit or manage files…"><button id="send">Send</button></div></section><aside class="ai"><div class="aihead"><strong>AI activity</strong><div id="status" class="status">Ready</div><div id="model" class="model">Model: waiting for live API</div></div><div id="chat" class="chat"></div><div class="image"><label>Image URL or upload (sent to vision model)</label><input id="imageUrl" placeholder="https://…"><input id="imageFile" type="file" accept="image/*"></div><div class="system"><label>System prompt</label><textarea id="systemPrompt">You are a precise static-site editor. Use automatic file operations and return valid HTML, CSS, or JavaScript.</textarea></div></aside></main>
<script>
const API='https://levityai-three.vercel.app';let files={"index.html":"<main>\n  <h1>Hello from Levity</h1>\n  <p>Edit this static page with AI.</p>\n</main>","styles.css":"body {\n  font-family: system-ui;\n  padding: 3rem;\n  color: #172326;\n}","script.js":"document.querySelector('h1')?.addEventListener('click', () => alert('Hello'));"};let active='index.html',image=null;const $=id=>document.getElementById(id);function render(){ $('fileList').innerHTML=Object.keys(files).map(p=>`<button class="file ${p===active?'active':''}" data-path="${p}">${p}</button>`).join('');document.querySelectorAll('.file').forEach(b=>b.onclick=()=>{active=b.dataset.path;$('content').value=files[active];$('activeName').textContent=active;render()});$('content').value=files[active]||'';$('numbers').innerHTML=$('content').value.split('\n').map((_,i)=>`<span>${i+1}<br></span>`).join('')}function add(msg,user=false,events=[]){$('chat').insertAdjacentHTML('beforeend',`<div class="msg ${user?'user':''}"><b>${user?'You':'AI'}</b>${msg}${events.length?`<details class="activity" open><summary>AI activity (${events.length} events)</summary><div class="events">${events.map(e=>`<div class="event">✓ ${e}</div>`).join('')}</div></details>`:''}</div>`);$('chat').scrollTop=$('chat').scrollHeight}function apply(d){(d.structuredEdits||[]).forEach(e=>{if(files[e.file]!==undefined)files[e.file]=e.after??files[e.file].replace(e.find,e.replace)});(d.fileOperations||[]).forEach(o=>{if(o.operation==='create')files[o.path]=o.content||'';if(o.operation==='clear'&&files[o.path]!==undefined)files[o.path]='';if(o.operation==='delete'){delete files[o.path];if(active===o.path)active=Object.keys(files)[0]||'index.html'}if(o.operation==='duplicate'&&o.destination&&files[o.path]!==undefined)files[o.destination]=files[o.path];if(o.operation==='move'&&o.destination&&files[o.path]!==undefined){files[o.destination]=files[o.path];delete files[o.path];if(active===o.path)active=o.destination}if(o.operation==='create_folder'){}if(o.operation==='move_folder'&&o.destination)Object.keys(files).filter(p=>p.startsWith(o.path+'/')).forEach(p=>{files[o.destination+'/'+p.slice(o.path.length+1)]=files[p];delete files[p]})});render()}async function send(){const p=$('prompt').value.trim();if(!p)return;$('prompt').value='';add(p,true);$('status').textContent='Running';$('model').textContent='Model: discovering from live API';const events=['Sending prompt','Providing current file and tree','Waiting for live API'];try{let body={prompt:p,systemPrompt:$('systemPrompt').value,autoReplace:true,fileReplacement:true,currentFile:{path:active,content:files[active]},files:Object.entries(files).map(([path,content])=>({path,content})),fileStructure:Object.keys(files),images:image?[image]:[],messages:[{role:'user',content:p}]};let r=await fetch(API+'/api/chat',{method:'POST',headers:{'content-type':'application/json','accept':'application/json'},body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');apply(d);if(d.model)$('model').textContent='Model: '+d.model;events.push(...(d.statuses||['Applied response']));$('status').textContent='Complete';add(d.message?.content||'Applied AI response.',false,events)}catch(e){$('status').textContent='Failed';add(e.message,false,[...events,'Error: '+e.message])}}$('content').oninput=()=>{files[active]=$('content').value;render()};$('send').onclick=send;$('prompt').onkeydown=e=>{if(e.key==='Enter')send()};$('newFile').onclick=()=>{let n='new-'+Object.keys(files).length+'.html';files[n]='';active=n;render()};$('previewBtn').onclick=()=>{$('editor').hidden=!$('editor').hidden;$('preview').hidden=!$('preview').hidden;if(!$('preview').hidden)$('preview').innerHTML=active.endsWith('.html')?files[active]:'<p>HTML preview only.</p>'};$('imageFile').onchange=e=>{let f=e.target.files[0];if(f){let r=new FileReader();r.onload=()=>{image={base64:r.result};};r.readAsDataURL(f)}};render();add('Ready. Automatic file operations are enabled.');
</script></body></html>
