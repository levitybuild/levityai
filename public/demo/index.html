<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Levity static editor</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#17211e;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}.top{height:58px;background:#fff;border-bottom:1px solid #dce5e0;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.brand{font-weight:800}.brand span{color:#21845d}.endpoint{font:12px ui-monospace;color:#73827b}.layout{display:grid;grid-template-columns:210px minmax(0,1fr) 360px;height:calc(100vh - 58px)}.files,.ai{background:#fbfcfb;padding:16px 12px;min-width:0}.files{border-right:1px solid #dce5e0}.ai{border-left:1px solid #dce5e0;display:flex;flex-direction:column;gap:10px}.label{display:flex;justify-content:space-between;color:#74817b;font-size:11px;font-weight:800;letter-spacing:.12em;margin:0 8px 12px}.project{font-size:13px;font-weight:700;padding:9px}.file{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:6px;color:#53625b;cursor:pointer}.file.active{background:#e1f2e9;color:#18714c;font-weight:700}.hint{font-size:11px;color:#84918b;line-height:1.5;margin:16px 8px}.workspace{display:flex;flex-direction:column;min-width:0;background:#fff}.toolbar{height:52px;border-bottom:1px solid #e5ebe8;padding:0 16px;display:flex;align-items:center;justify-content:space-between}.toolbar button,.composer button,.inspect{border:1px solid #cddbd4;background:#fff;border-radius:6px;padding:7px 10px;color:#40534b;cursor:pointer}.toolbar button.primary,.composer button{background:#21845d;color:#fff;border-color:#21845d}.toolbar button.on{background:#173c2d;color:#fff}.code{display:grid;grid-template-columns:42px 1fr;flex:1;min-height:0;background:#fbfcfb}.numbers{padding:17px 9px;text-align:right;color:#9aa8a1;font:13px/1.65 ui-monospace}.code textarea{resize:none;border:0;outline:0;background:transparent;padding:17px 12px;color:#26342e;font:13px/1.65 ui-monospace;white-space:pre;overflow:auto}.preview{flex:1;min-height:0;background:#fff}.preview iframe{width:100%;height:100%;border:0}.composer{border-top:1px solid #e5ebe8;padding:11px;display:flex;gap:8px}.composer input,.system textarea,.image input{border:1px solid #d2ded8;border-radius:6px;padding:9px;outline:0;font:inherit}.composer input{flex:1}.aihead{display:flex;flex-direction:column;gap:4px}.status{font-size:12px;color:#21845d;font-weight:700}.model{font-size:11px;color:#73827b;font-family:ui-monospace}.chat{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px}.msg{background:#eef6f1;border:1px solid #d9eae0;border-radius:7px;padding:9px;font-size:12px;line-height:1.45}.msg.user{background:#fff;border-color:#dce5e0}.msg b{display:block;font-size:11px;margin-bottom:4px}.activity{margin-top:7px;border-top:1px solid #d4e5da;padding-top:6px}.activity summary{cursor:pointer;color:#426154;font-size:11px}.event{font:11px ui-monospace;color:#52645c;margin:4px 0}.system,.image{display:flex;flex-direction:column;gap:5px;font-size:11px;color:#64736c}.system textarea{height:70px;resize:vertical;font-size:11px}.image input{font-size:11px}.inspect-help{font-size:11px;color:#72817a;padding:6px 0}.selected{outline:2px solid #f08b35!important;outline-offset:2px}.inspect-layer{position:fixed;inset:0;z-index:10;pointer-events:none}.inspect-badge{position:fixed;z-index:11;top:12px;left:50%;transform:translateX(-50%);background:#173c2d;color:#fff;border-radius:999px;padding:8px 13px;font-size:12px;box-shadow:0 4px 20px #0002}
@media(max-width:900px){.layout{grid-template-columns:170px minmax(0,1fr)}.ai{grid-column:1/-1;border:0;border-top:1px solid #dce5e0;height:310px}.layout{height:auto;min-height:calc(100vh - 58px)}.workspace{min-height:620px}.endpoint{display:none}}
</style></head>
<body>
<header class="top"><div class="brand">Levity <span>/ static editor</span></div><div class="endpoint">live API: https://levityai-three.vercel.app</div></header>
<main class="layout"><aside class="files"><div class="label">FILES <button id="newFile">+</button></div><div class="project">demo-project</div><div id="fileList"></div><div class="hint">Automatic multi-file writes are enabled. The AI can edit, create, clear, delete, move, duplicate, and create folders.</div></aside>
<section class="workspace"><div class="toolbar"><strong id="activeName">index.html</strong><div><button id="inspectBtn">Inspect</button> <button id="previewBtn" class="primary">Preview</button></div></div><div id="editor" class="code"><div id="numbers" class="numbers"></div><textarea id="content" spellcheck="false"></textarea></div><div id="preview" class="preview" hidden></div><div class="composer"><input id="prompt" placeholder="Ask AI to fix or manage the static project…"><button id="send">Send</button></div></section>
<aside class="ai"><div class="aihead"><strong>AI activity</strong><div id="status" class="status">Ready</div><div id="model" class="model">Model: turboderp/Qwen3.8-27B-exl3</div></div><div id="chat" class="chat"></div><div class="image"><label for="imageUrl">Image URL or upload</label><input id="imageUrl" placeholder="https://…"><input id="imageFile" type="file" accept="image/*"></div><div class="system"><label for="systemPrompt">System prompt</label><textarea id="systemPrompt">You are a precise static-site editor. Use multiple file operations when needed, verify your changes, and return valid HTML, CSS, and JavaScript.</textarea></div></aside></main>
<script>
const API='https://levityai-three.vercel.app';let files={'index.html':'<main>\n  <h1>Hello from Levity</h1>\n  <p>Edit this static page with AI.</p>\n</main>','styles.css':'body {\n  font-family: system-ui;\n  padding: 3rem;\n  color: #172326;\n}','script.js':'document.querySelector(\'h1\')?.addEventListener(\'click\', () => alert(\'Hello\'));'};let active='index.html',image=null,history=[];const $=id=>document.getElementById(id);const escapeHtml=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
function render(){const paths=Object.keys(files);$('fileList').innerHTML=paths.map(p=>`<button class="file ${p===active?'active':''}" data-path="${escapeHtml(p)}">${escapeHtml(p)}</button>`).join('');document.querySelectorAll('.file').forEach(b=>b.onclick=()=>{active=b.dataset.path;render()});$('activeName').textContent=active;$('content').value=files[active]||'';$('numbers').innerHTML=$('content').value.split('\n').map((_,i)=>`${i+1}<br>`).join('')}
function add(text,user=false,events=[]){const box=document.createElement('div');box.className='msg'+(user?' user':'');box.innerHTML=`<b>${user?'You':'AI'}</b><div>${escapeHtml(text).replace(/\n/g,'<br>')}</div>`;if(events.length){const d=document.createElement('details');d.className='activity';d.open=false;d.innerHTML=`<summary>Activity (${events.length} events)</summary><div>${events.map(e=>`<div class="event">${escapeHtml(e)}</div>`).join('')}</div>`;box.appendChild(d)}$('chat').appendChild(box);$('chat').scrollTop=$('chat').scrollHeight}
function setStatus(text){$('status').textContent=text}
function applyResult(data){const events=[];(data.structuredEdits||[]).forEach(e=>{if(files[e.file]!==undefined){files[e.file]=typeof e.after==='string'?e.after:files[e.file].replace(e.find,e.replace);events.push(`edited ${e.file}`)}});(data.fileOperations||[]).forEach(o=>{const p=o.path||o.file;if(o.operation==='create'){files[p]=o.content||'';events.push(`created ${p}`)}if(o.operation==='clear'&&files[p]!==undefined){files[p]='';events.push(`cleared ${p}`)}if(o.operation==='delete'){delete files[p];events.push(`deleted ${p}`);if(active===p)active=Object.keys(files)[0]||''}if(o.operation==='duplicate'&&files[p]!==undefined){files[o.destination]=files[p];events.push(`duplicated ${p} → ${o.destination}`)}if(o.operation==='move'&&files[p]!==undefined){files[o.destination]=files[p];delete files[p];if(active===p)active=o.destination;events.push(`moved ${p} → ${o.destination}`)}if(o.operation==='move_folder'){Object.keys(files).filter(x=>x===p||x.startsWith(p+'/')).forEach(x=>{const dest=o.destination+x.slice(p.length);files[dest]=files[x];delete files[x]});events.push(`moved folder ${p} → ${o.destination}`)}if(o.operation==='create_folder')events.push(`created folder ${p}`)});render();return events}
function preview(){const html=files['index.html']||'';const css=files['styles.css']||'';const js=files['script.js']||'';const closeTag=String.fromCharCode(60)+'/script';const safeJs=js.split(closeTag).join(String.fromCharCode(60)+'\\/script');$('preview').innerHTML=`<iframe title="Static preview" sandbox="allow-scripts allow-same-origin" srcdoc="${escapeHtml(html.replace('</head>',`<style>${css}</style></head>`).replace('</body>',`<script>${safeJs}${String.fromCharCode(60)}/script></body>`))}"></iframe>`}
function inspectMode(){const frame=$('preview').querySelector('iframe');if(!frame){add('Open Preview before enabling Inspect.');return}const badge=document.createElement('div');badge.className='inspect-badge';badge.textContent='Inspect mode: hover or tap an element';document.body.appendChild(badge);let timer=0;const bind=()=>{try{const doc=frame.contentDocument;if(!doc)return;clearInterval(timer);const style=doc.createElement('style');style.textContent='.levity-inspect-hover{outline:2px solid #118b82!important;outline-offset:2px!important;cursor:crosshair!important}';doc.head.appendChild(style);const targetPath=el=>{const path=[];let n=el;while(n&&n.nodeType===1&&n!==doc.documentElement){let index=1,s=n.previousElementSibling;while(s){if(s.tagName===n.tagName)index++;s=s.previousElementSibling}path.unshift(`${n.tagName.toLowerCase()}:nth-of-type(${index})`);n=n.parentElement}return path.join(' > ')};const select=e=>{const el=e.target.closest('*');if(!el||el===doc.documentElement)return;e.preventDefault();e.stopPropagation();doc.querySelectorAll('.levity-inspect-hover').forEach(node=>node.classList.remove('levity-inspect-hover'));const path=targetPath(el);const context=`Inspect target: ${path}\nTag: ${el.tagName.toLowerCase()}\nText: ${(el.textContent||'').trim().slice(0,300)}`;$('prompt').value=`Fix this inspected element. ${context}`;add(context,true);badge.textContent='Element attached to prompt';setTimeout(()=>badge.remove(),1200);doc.removeEventListener('pointerover',hover,true);doc.removeEventListener('pointerout',unhover,true);doc.removeEventListener('pointerdown',select,true)};const hover=e=>{const el=e.target.closest('*');if(el&&el!==doc.documentElement)el.classList.add('levity-inspect-hover')};const unhover=e=>{const el=e.target.closest('*');if(el)el.classList.remove('levity-inspect-hover')};doc.addEventListener('pointerover',hover,true);doc.addEventListener('pointerout',unhover,true);doc.addEventListener('pointerdown',select,true)}catch{}};frame.addEventListener('load',bind,{once:true});bind();timer=setInterval(bind,100)}
function discover(){$('model').dataset.model='turboderp/Qwen3.8-27B-exl3';$('model').textContent='Model: turboderp/Qwen3.8-27B-exl3'}
async function send(){const prompt=$('prompt').value.trim();if(!prompt)return;const all=Object.entries(files).map(([path,content])=>({path,content}));add(prompt,true);$('prompt').value='';setStatus('Thinking…');const events=['reading current file and file structure'];try{const body={model:$('model').dataset.model||undefined,messages:[{role:'user',content:prompt}],systemPrompt:$('systemPrompt').value,files:all,currentFile:{path:active,content:files[active]},fileStructure:Object.keys(files),autoReplace:true,approvalPolicy:{mode:'auto'},maxTokens:2048,stream:false,images:image?[image]:[]};const r=await fetch(API+'/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));(d.statuses||[]).forEach(s=>{if(!events.includes(s))events.push(s)});if(!r.ok)throw new Error(d.error||d.detail||`HTTP ${r.status}`);events.push('verifying changes…');const changed=applyResult(d);events.push(...changed);events.push('verified changes');setStatus('Ready');add(d.message?.content||'Changes applied and verified.',false,events)}catch(e){setStatus('Error');add(String(e.message||e),false,[...events,'found an error'])}}
$('content').oninput=e=>{files[active]=e.target.value;render()};$('send').onclick=send;$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}};$('previewBtn').onclick=()=>{const hidden=$('preview').hidden;$('preview').hidden=!hidden;$('editor').hidden=hidden;if(hidden)preview()};$('inspectBtn').onclick=inspectMode;$('newFile').onclick=()=>{const p=prompt('New file path','component.html');if(p){files[p]='';active=p;render()}};$('imageUrl').onchange=e=>{image=e.target.value?{url:e.target.value}:null};$('imageFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>image={base64:String(reader.result),mimeType:f.type};reader.readAsDataURL(f)};render();discover();
</script></body></html>
